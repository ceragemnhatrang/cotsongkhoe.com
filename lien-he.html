<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đặt lịch tư vấn – Cột Sống Khỏe</title>
<meta name="description" content="Đăng ký tư vấn miễn phí về đau cổ vai gáy, đau lưng và tư thế làm việc đúng.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Lora:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/site.css">
<style>
:root{--green:#174D3C;--white:#fff;--gold:#D8B66A;--mint:#EAF3EE;--ink:#303A35;--line:rgba(23,77,60,.16);
--serif:'Lora',Georgia,'Times New Roman',serif;--sans:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--white);color:var(--ink);font:400 17px/1.7 var(--sans)}
main h1,main h2{font-family:var(--serif);color:var(--green);line-height:1.25;margin:0 0 .6em}
main h1{font-size:clamp(2rem,5vw,3.4rem)}
main h3{font:600 1.15rem var(--sans);color:var(--green)}
main p{margin:0 0 1em;max-width:62ch}
main .wrap{max-width:1120px;margin:0 auto;padding:0 24px}
main .hero.sm{background:var(--mint);padding:64px 0 72px}
main input,main select,main textarea,main button{font-family:inherit}
</style>
</head>
<body>

<div id="site-header"></div>

<main>
  <section class="hero sm">
    <div class="wrap">
      <h1>Đặt lịch tư vấn</h1>
      <p>Điền thông tin bên dưới, chúng tôi sẽ liên hệ sớm nhất để trao đổi với bạn.</p>
      <div id="form-module"></div>
    </div>
  </section>
  
</main>

<div id="site-footer"></div>
<script src="site.js"></script>
</body>
</html>
